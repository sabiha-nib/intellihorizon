# IntelliHorizon: GitHub -> Cloudflare Workers (+ D1, R2).
# Every push and pull request: install, typecheck, unit tests, production build.
# Pull requests: the build is uploaded as a preview version (its own URL); production is untouched.
# Push to main: apply D1 migrations, deploy to production, then smoke-test the live site. A failed check stops the run
# before anything is deployed. Secrets needed in the GitHub repo: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint (reported, not blocking: the vendored template components are not linted to this app's rules)
        run: bun run lint || echo "::warning::lint reported problems"
      - name: Typecheck
        run: bunx tsc --noEmit -p .
      - name: Unit tests
        run: bun test tests/*.unit.test.ts
      - name: Build
        run: bunx vite build
      - name: No secrets in the browser bundle
        run: |
          if grep -rEl "sk-ant-[A-Za-z0-9_-]{20}|AIza[0-9A-Za-z_-]{30}|sk-proj-[A-Za-z0-9_-]{20}|EDU_ADMIN_TOKEN" dist/client; then
            echo "::error::a secret-like string is in the client bundle"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: app/dist
          retention-days: 7

  preview:
    name: Preview version (pull requests)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: dist, path: app/dist }
      - name: Upload a preview version (does not change production traffic)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler versions upload --message "PR #${{ github.event.pull_request.number }}"

  deploy:
    name: Deploy to production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: dist, path: app/dist }
      - name: Make sure the R2 bucket exists
        run: bunx wrangler r2 bucket info intellihorizon-files >/dev/null 2>&1 || bunx wrangler r2 bucket create intellihorizon-files
      - name: Apply D1 migrations (additive only; already-applied ones are skipped)
        run: bunx wrangler d1 migrations apply DB --remote
      - name: Deploy
        id: deploy
        run: |
          bunx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE "https://[a-z0-9.-]+\.workers\.dev" deploy.log | head -1)
          echo "url=${PRODUCTION_URL:-$url}" >> "$GITHUB_OUTPUT"
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      - name: Smoke test the live site
        run: node scripts/smoke.mjs "${{ steps.deploy.outputs.url }}"
