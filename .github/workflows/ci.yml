# IntelliHorizon CI. Vercel's GitHub integration builds and deploys (production from main, private previews from pull
# requests); this workflow is the quality gate that runs on the same pushes: typecheck, unit tests, a production build
# and a scan that no secret-like string reaches the browser bundle. Protect main with "require CI to pass" so a broken
# build is never merged and therefore never deployed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, unit tests, build, secret scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint (reported, not blocking: vendored template components are not linted to this app's rules)
        run: bun run lint || echo "::warning::lint reported problems"
      - name: Typecheck
        run: bunx tsc --noEmit -p .
      - name: Unit tests
        run: bun test tests/*.unit.test.ts
      - name: Production build (Node output, same code Vercel builds)
        run: NITRO_PRESET=node-server bunx vite build
      - name: No secrets in the browser bundle
        run: |
          if grep -rEl "sk-ant-[A-Za-z0-9_-]{20}|AIza[0-9A-Za-z_-]{30}|sk-proj-[A-Za-z0-9_-]{20}|postgres(ql)?://[^ \"']+:[^@ \"']+@|service_role" .output/public; then
            echo "::error::a secret-like string is in the client bundle"; exit 1; fi
